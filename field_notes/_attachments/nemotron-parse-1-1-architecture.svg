<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 320">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;display=swap');
      text { font-family: 'Geist', 'Helvetica Neue', Arial, sans-serif; fill: #33302E; }
      .label-lg { font-size: 17px; font-weight: 600; }
      .label-md { font-size: 14px; font-weight: 500; }
      .label-sm { font-size: 12.5px; font-weight: 400; fill: #66605C; }
      .label-on-fill { font-size: 15px; font-weight: 600; fill: #FFFFFF; }
      .label-on-fill-sm { font-size: 12px; font-weight: 400; fill: #FFFFFF; opacity: 0.92; }
      .annot { font-style: italic; font-size: 12.5px; fill: #66605C; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#33302E"/>
    </marker>
  </defs>

  <!-- ============== 1. Image patches (column) ============== -->
  <g id="patches">
    <text x="51" y="48" text-anchor="middle" class="annot">image patches</text>
    <g fill="#FFFFFF" stroke="#33302E" stroke-width="1.3">
      <rect x="40" y="64"  width="22" height="22"/>
      <rect x="40" y="89"  width="22" height="22"/>
      <rect x="40" y="114" width="22" height="22"/>
      <rect x="40" y="139" width="22" height="22"/>
      <rect x="40" y="164" width="22" height="22"/>
      <rect x="40" y="189" width="22" height="22"/>
      <rect x="40" y="214" width="22" height="22"/>
      <rect x="40" y="239" width="22" height="22"/>
      <rect x="40" y="264" width="22" height="22"/>
      <rect x="40" y="289" width="22" height="22"/>
    </g>
  </g>

  <!-- Arrow patches -> encoder -->
  <line x1="72" y1="187" x2="140" y2="187" stroke="#33302E" stroke-width="1.4" marker-end="url(#arrow)"/>

  <!-- ============== 2. RADIO vision encoder ============== -->
  <g id="encoder">
    <rect x="145" y="100" width="240" height="175" fill="#FFFFFF" stroke="#33302E" stroke-width="1.6"/>
    <text x="265" y="175" text-anchor="middle" class="label-lg">RADIO vision</text>
    <text x="265" y="198" text-anchor="middle" class="label-lg">encoder</text>
    <text x="265" y="228" text-anchor="middle" class="label-md">ViT-H/16</text>
    <text x="265" y="298" text-anchor="middle" class="label-sm">657M params</text>
  </g>

  <!-- Arrow encoder -> neck -->
  <line x1="385" y1="187" x2="448" y2="187" stroke="#33302E" stroke-width="1.4" marker-end="url(#arrow)"/>

  <!-- ============== 3. Convolutional vision neck (FT teal accent) ============== -->
  <g id="neck">
    <polygon points="453,100 453,275 680,220 680,155"
             fill="#0F5499" stroke="#0F5499" stroke-width="1.6"/>
    <text x="566" y="48" text-anchor="middle" class="label-md">convolutional vision neck</text>
    <text x="566" y="182" text-anchor="middle" class="label-on-fill">4× compression</text>
    <text x="566" y="202" text-anchor="middle" class="label-on-fill-sm">8K → 2K tokens</text>
  </g>

  <!-- Arrow neck -> decoder -->
  <line x1="680" y1="187" x2="748" y2="187" stroke="#33302E" stroke-width="1.4" marker-end="url(#arrow)"/>

  <!-- ============== 4. mBART decoder ============== -->
  <g id="decoder">
    <rect x="753" y="100" width="240" height="175" fill="#FFFFFF" stroke="#33302E" stroke-width="1.6"/>
    <text x="873" y="187" text-anchor="middle" class="label-lg">mBART</text>
    <text x="873" y="210" text-anchor="middle" class="label-lg">decoder</text>
    <text x="873" y="298" text-anchor="middle" class="label-sm">256M params</text>
  </g>
</svg>
